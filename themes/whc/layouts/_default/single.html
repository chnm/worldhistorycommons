{{ define "main" }}
<div class="content-header">
  <div class="content-header--label">{{ .Type | title }}</div>
  <h1>{{ .Title }}</h1>
  {{ with .Params.authors }}
  <div class="content-header--author">
    {{ range . }}<div>{{ . }}</div>{{ end }}
  </div>
  {{ end }}
</div>
<div class="content-well">
  {{ .Content }}
</div>
{{ partial "tags.html" . }}
{{ partial "citation.html" . }}
{{ end }}

{{ define "main" }}
<div class="content-header">
  <h1 class="content-header--label">{{ .Title }}</h1>
</div>
<div class="content-well">
  <div class="tags">
    {{ range .Pages }}
    <div><a href="{{ .RelPermalink }}">{{ .Title }} ({{ len .Pages }})</a></div>
    {{ end }}
  </div>
</div>
{{ end }}

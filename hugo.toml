baseURL = 'https://worldhistorycommons.org/'
languageCode = 'en-us'
title = 'World History Commons'
theme = 'whc'

# Legacy /node/{id} paths (and any future `aliases:` for moved pages) are turned
# into 301s by the web server (Caddy), not Hugo. Hugo must not write alias stub
# HTML — Caddy is the sole redirect authority. See docs/REDIRECTS.md.
disableAliases = true

[pagination]
  pagerSize = 20

# Redirect manifest — the deterministic legacy->native bridge for the Caddy
# redirect pipeline (utils/redirect_mapper.py). The home page emits
# /redirects.json listing every page's native URL and its legacy paths.
[outputs]
  home = ['HTML', 'RSS', 'redirects']

[outputFormats.redirects]
  mediaType = 'application/json'
  baseName = 'redirects'
  isPlainText = true
  notAlternative = true

[taxonomies]
  region = 'regions'
  subject = 'subjects'
  time_period = 'time_periods'

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true
